name: Publicar panel

# Publica el panel (index.html + data.json) en GitHub Pages.
# Se dispara cada vez que se sube un cambio a main — por ejemplo cuando el
# programa que corre en tu PC actualiza data.json con los importados del día.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar GitHub Pages (automático)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp data.json  _site/data.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
